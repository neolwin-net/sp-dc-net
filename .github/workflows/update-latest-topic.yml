name: Update latest topics

on:
  push:
    branches:
      - main
    paths:
      - 'pdf/lab_writeups/**.pdf'
      - 'pdf/note_mm/**.pdf'
      - 'lab-writeups.md'
      - 'networking-notes.md'
      - '.github/workflows/update-latest-topic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest PDF in each collection and update homepage
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import subprocess
          from pathlib import Path

          home_path = Path("index.md")
          home = home_path.read_text(encoding="utf-8")

          def git_timestamp(path):
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", path],
                  text=True, capture_output=True, check=True
              ).stdout.strip()
              return int(result) if result else 0

          def latest_topic(listing_path, pdf_prefix, collection_label, collection_url, type_label):
              listing = Path(listing_path).read_text(encoding="utf-8")
              card_pattern = re.compile(
                  r'<a class="resource-card"(?P<attrs>.*?)>(?P<body>.*?)</a>',
                  re.S
              )
              candidates = []
              for match in card_pattern.finditer(listing):
                  attrs, body = match.group("attrs"), match.group("body")
                  href = re.search(r'href="{{\s*[\'"]?([^\'"}]+\.pdf)[\'"]?\s*\|\s*relative_url\s*}}"', attrs)
                  if not href:
                      continue
                  path = href.group(1).strip()
                  if not path.startswith(pdf_prefix) or not Path(path).is_file():
                      continue
                  title_match = re.search(r'<strong>(.*?)</strong>', body, re.S)
                  category_match = re.search(r'<small>(.*?)</small>', body, re.S)
                  if not title_match:
                      continue
                  title = re.sub(r'\s+', ' ', title_match.group(1)).strip()
                  title = re.sub(r'^\d+\.\s*', '', title)
                  category_text = re.sub(r'\s+', ' ', category_match.group(1)).strip() if category_match else collection_label
                  category = category_text.split('·')[0].strip()
                  candidates.append((git_timestamp(path), path, title, category))

              if not candidates:
                  raise SystemExit(f"No listed PDF topics found for {collection_label}")
              _, path, title, category = max(candidates, key=lambda item: item[0])
              if collection_label == "Lab Writeups":
                  description = f"Configure and verify {title} in a practical networking lab."
              else:
                  description = f"Review the key concepts and practical applications of {title}."
              return f'''<div class="latest-topic-group">
              <p class="latest-topic-type">{type_label}</p>
              <a class="latest-row" href="{{{{ '{path}' | relative_url }}}}">
                <span class="latest-icon">↻</span>
                <span>
                  <strong>{title}</strong>
                  <small>{collection_label} · {category} · Open PDF document</small>
                </span>
                <span class="resource-arrow">↗</span>
              </a>
              <p class="latest-description">
                {description}
                Browse all <a href="{{{{ '{collection_url}' | relative_url }}}}">{collection_label}</a>.
              </p>
            </div>'''

          lab = latest_topic("lab-writeups.md", "pdf/lab_writeups/", "Lab Writeups", "/lab-writeups/", "LAB WRITEUPS")
          notes = latest_topic("networking-notes.md", "pdf/note_mm/", "Networking Notes", "/networking-notes/", "NETWORKING NOTES")
          section = f'''<div class="home-latest glass-panel">
            <div class="section-title-row">
              <div>
                <p class="eyebrow">RECENTLY UPDATED</p>
                <h2>Last Updated Topics</h2>
              </div>
              <span class="section-mark">SP–DC–NET</span>
            </div>

            {lab}

            {notes}
          </div>

          '''
          start = home.find('<div class="home-latest glass-panel">')
          end = home.find('<div class="home-contact">', start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate homepage latest-topic section")
          home_path.write_text(home[:start] + section + home[end:], encoding="utf-8")
          PY

      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.md; then
            echo "Latest topics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md
          git commit -m "Automatically update latest topics"
          git push
